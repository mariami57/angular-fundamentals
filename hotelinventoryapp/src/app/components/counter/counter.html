<h2 class="text-lg mb-2">Counter value: {{ counterValue() }}</h2>

<div class="flex justify-start gap-2">
    <button class="mx-0 px-4 py-2 bg-gray-300 border border-gray-400 rounded" (click)="increment()">Increment</button>
    <button class="mx-0 px-4 py-2 bg-gray-300 border border-gray-400 rounded" (click)="decrement()">Decrement</button>
    <button class="mx-0 px-4 py-2 bg-gray-300 border border-gray-400 rounded"(click)="reset()">Reset</button>
</div>
