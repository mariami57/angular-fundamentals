@for (item of todoItems(); track item.id) {
    <app-todo-item [todo]="item" (completed)="markComplete($event)"/>
    

}

<h3>Completed</h3>
<app-completed-items-list-component [completedItems]="completedItems()" />

<h3>High Priority</h3>
<app-high-priority-todos-component [highPriorityTodos]="highPriorityTodos()" />
